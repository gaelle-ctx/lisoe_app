<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lisoé</title>
<meta name="theme-color" content="#F3EEFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lisoé">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --sf:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  --bg:#F3EEFF; --surface:#FFFFFF; --ink:#2B2350; --muted:#4A4370; --line:#2B2350;
  --primary:#6C4CF1; --primary-shadow:#4A2FC2; --on-primary:#FFFFFF; --tile-off:#E4DCFA; --sun:#FFE88A; --soft:#F3EEFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1830; --surface:#2A2448; --ink:#F3EEFF; --muted:#D3CBF2; --line:#0E0B1C;
    --primary:#6C4CF1; --primary-shadow:#3A2399; --on-primary:#FFFFFF; --tile-off:#433B6E; --sun:#FFE88A; --soft:#221D3C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1830; --surface:#2A2448; --ink:#F3EEFF; --muted:#D3CBF2; --line:#0E0B1C;
  --primary:#6C4CF1; --primary-shadow:#3A2399; --on-primary:#FFFFFF; --tile-off:#433B6E; --sun:#FFE88A; --soft:#221D3C;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sf);-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
.app{width:100%;height:100%;height:100dvh;max-width:480px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-auto-rows:auto;gap:12px;padding:12px 16px 16px;overflow-y:auto;overflow-x:hidden}
.app>*{min-width:0}
button,a,input{touch-action:manipulation}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.top h1{display:flex;align-items:center;justify-content:center;gap:8px;margin:0;font-family:var(--sf);font-weight:600;font-size:22px;text-align:center;flex:1}
.round{width:48px;height:48px;border-radius:24px;background:var(--surface);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.round[disabled]{visibility:hidden}
.round svg{stroke:var(--ink)}
.stage{position:relative;min-height:0;background:var(--surface);border:3px solid var(--line);border-radius:32px;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
#gl:active{cursor:grabbing}
.cap-ring{position:absolute;left:0;top:0;border:3px dashed var(--primary);border-radius:22px;pointer-events:none;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hint{position:absolute;right:12px;top:16%;width:150px;background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:12px;font-family:var(--sf);font-weight:600;font-size:16px;line-height:1.25;pointer-events:none}
.hint::before{content:"";position:absolute;left:-10px;top:22px;width:14px;height:14px;background:var(--surface);border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:rotate(45deg)}
.tip{position:absolute;left:0;right:0;bottom:10px;margin:0;text-align:center;font-size:13px;font-weight:700;color:var(--muted);pointer-events:none}
.nametag{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:var(--sun);color:#2B2350;border:3px solid var(--line);border-radius:999px;padding:6px 18px;font-family:var(--sf);font-weight:600;font-size:20px;white-space:nowrap;pointer-events:none}
.panel{position:absolute;top:10px;right:10px;bottom:38px;width:min(48%,196px);background:var(--surface);border:3px solid var(--line);border-radius:24px;padding:10px 8px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding-left:4px}
.panel-head h2{margin:0;font-family:var(--sf);font-weight:600;font-size:18px}
.close{width:44px;height:44px;border-radius:22px;border:none;background:var(--soft);display:flex;align-items:center;justify-content:center;padding:0}
.close svg{stroke:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:max-content;align-content:start;align-items:start;gap:8px;overflow-y:auto;padding:2px;min-height:0;flex:1 1 auto}
.tile{display:block;position:relative;width:100%;height:auto;min-height:44px;margin:0;padding:8px 4px 8px;background:#FFFFFF;border:3px solid var(--tile-off);border-radius:16px;font-weight:800;font-size:12px;line-height:1.2;color:#2B2350;text-align:center;overflow:hidden;overflow-wrap:anywhere;-webkit-appearance:none;appearance:none}
.tile[aria-pressed="true"]{border-color:var(--primary)}
.tile img,.tile svg{display:block;width:60px;max-width:100%;height:38px;margin:0 auto 4px;object-fit:contain;flex-shrink:0}
.tile.big img{width:66px;height:72px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;border:none;padding:4px 0;font-weight:800;font-size:12px;color:var(--ink)}
.swatch span{width:44px;height:44px;border-radius:22px;border:3px solid var(--line);box-shadow:0 0 0 4px transparent}
.swatch[aria-pressed="true"] span{box-shadow:0 0 0 4px var(--primary)}
.picker{grid-column:1/-1;display:flex;flex-direction:column;gap:10px}
.sv{position:relative;width:100%;aspect-ratio:1;border:3px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none;cursor:crosshair}
.sv canvas{width:100%;height:100%;display:block}
.sv-thumb{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #2B2350;pointer-events:none}
.hue{-webkit-appearance:none;appearance:none;width:100%;height:30px;border-radius:15px;border:3px solid var(--line);background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);margin:0}
.hue::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:30px;border-radius:8px;background:#fff;border:3px solid #2B2350}
.hue::-moz-range-thumb{width:16px;height:24px;border-radius:8px;background:#fff;border:3px solid #2B2350}
.pk-row{display:flex;align-items:center;gap:8px}
.pk-prev{width:36px;height:36px;border-radius:18px;border:3px solid var(--line);flex-shrink:0}
.pk-hex{flex:1;min-width:0;font-family:var(--sf);font-weight:600;font-size:15px;letter-spacing:.03em}
.pipette{width:44px;height:44px;border-radius:14px;background:var(--sun);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.pk-sw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px}
.pk-sw button{height:44px;background:transparent;border:none;display:flex;align-items:center;justify-content:center;padding:0}
.pk-sw span{width:30px;height:30px;border-radius:15px;border:3px solid var(--line)}
.seg{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:3px;padding:3px;background:var(--soft);border-radius:15px}
.seg button{flex:1 1 auto;padding:0 8px;min-height:44px;border:none;border-radius:12px;background:transparent;font-family:var(--sf);font-weight:600;font-size:14px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 0 0 2px var(--line)}
.phrase{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;padding:2px}
.phrase label{font-weight:800;font-size:14px}
.phrase textarea{width:100%;min-height:76px;border:3px solid var(--line);border-radius:16px;padding:10px 12px;font-family:var(--sf);font-weight:600;font-size:16px;line-height:1.3;background:var(--surface);color:var(--ink);resize:none}
.phrase-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.phrase-foot span{font-weight:800;font-size:13px;color:var(--muted)}
.phrase .secondary{height:44px;font-size:14px}
.pk-label{margin:4px 0 0;font-family:var(--sf);font-weight:600;font-size:15px}
.pk-ink{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pk-ink button{display:flex;align-items:center;gap:6px;min-height:44px;padding:4px 6px;background:#FFFFFF;border:3px solid var(--tile-off);border-radius:14px;font-weight:800;font-size:12px;color:#2B2350;text-align:left}
.pk-ink button[aria-pressed="true"]{border-color:var(--primary)}
.pk-ink i{flex-shrink:0;width:14px;height:22px;border-radius:7px 7px 9px 9px;border:2px solid #2B2350}
.pk-sw button[aria-pressed="true"] span{box-shadow:0 0 0 3px var(--primary)}
.photo{position:fixed;inset:0;background:rgba(28,24,48,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.photo-card{width:100%;max-width:420px;max-height:100%;overflow:auto;background:var(--surface);border:3px solid var(--line);border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:12px}
.photo-card h2{margin:0;font-family:var(--sf);font-weight:600;font-size:20px}
.photo-box{position:relative;border-radius:16px;overflow:hidden;border:3px solid var(--line);touch-action:none;cursor:crosshair}
.photo-box canvas{display:block;width:100%;height:auto}
.photo-dot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #2B2350;pointer-events:none}
.photo .primary{height:52px;font-size:18px;margin:0}
.bottom{display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-width:48px;padding:0 10px!important;height:48px;border-radius:16px;border:3px solid var(--line);background:var(--surface);font-family:var(--sf);font-weight:600;font-size:12px;padding:0}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.primary{display:flex;align-items:center;justify-content:center;gap:10px;height:60px;border-radius:30px;border:none;background:var(--primary);color:var(--on-primary);font-family:var(--sf);font-weight:600;font-size:20px;box-shadow:0 6px 0 var(--primary-shadow);margin-bottom:6px}
.primary:active{transform:translateY(3px);box-shadow:0 3px 0 var(--primary-shadow)}
.primary[disabled]{opacity:.5;cursor:not-allowed}
.secondary{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:26px;background:var(--surface);border:3px solid var(--line);font-family:var(--sf);font-weight:600;font-size:16px;padding:0 14px}
.secondary svg{stroke:var(--ink)}
.row{display:flex;gap:8px}
.row>*{flex:1 1 0;min-width:0}
label.lbl{font-weight:800;font-size:15px}
.namefield{display:flex;gap:8px}
.namefield input{flex:1;min-width:0;height:56px;padding:0 18px;border:3px solid var(--line);border-radius:20px;background:var(--surface);font-family:var(--sf);font-weight:600;font-size:22px}
.dice{width:56px;height:56px;border-radius:20px;background:var(--sun);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{height:44px;padding:0 16px;border-radius:22px;border:3px solid var(--line);font-family:var(--sf);font-weight:600;font-size:16px;color:#2B2350}
.small{margin:0;font-size:13px;font-weight:700;color:var(--muted)}
.traits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:12px 14px;font-size:14px;font-weight:700}
.traits span:nth-child(odd){color:var(--muted)}
.code{font-family:var(--sf);font-weight:600;letter-spacing:.04em}
.status{min-height:18px;margin:0;font-size:14px;font-weight:700;color:var(--muted);text-align:center}
[hidden]{display:none!important}
/* ---------- phones: options open as a sheet under the pen ---------- */
@media (max-width:600px){
  .app{padding:8px 12px 10px;gap:8px;grid-template-rows:auto minmax(190px,1fr)}
  .top{min-height:44px;gap:8px}
  .top h1{font-size:19px}
  .round{width:44px;height:44px}
  .stage{border-radius:24px}
  .hint{width:132px;font-size:14px;padding:10px;top:10%;right:10px}
  .panel{top:8px;right:8px;bottom:8px;width:57%;padding:8px 6px;border-radius:20px;gap:6px}
  .panel-head h2{font-size:16px}
  .close{width:44px;height:44px}
  .grid{gap:6px}
  .tile{padding:6px 2px;font-size:11px;border-radius:14px}
  .tile img,.tile svg{width:52px;height:34px}
  .tile.big img{width:56px;height:62px}
  .pk-ink{grid-template-columns:minmax(0,1fr)}
  .pk-sw{grid-template-columns:repeat(4,minmax(0,1fr))}
  .pk-sw span{width:26px;height:26px}
  .seg button{font-size:13px;padding:0 6px}
  .app.sheet-open .tip,.app.sheet-open .nametag{display:none}
  .tip{font-size:12px;bottom:6px}
  .nametag{font-size:17px;bottom:26px;padding:4px 14px}
  .tabs button{height:44px;border-radius:14px}
  .primary{height:54px;font-size:18px;border-radius:27px}
  .secondary{height:48px;font-size:15px}
  .namefield input{height:52px;font-size:20px}
  .dice{width:52px;height:52px}
  .traits{font-size:13px;padding:10px 12px}
  .bottom{gap:10px}
  .panel.sheet{position:static;width:auto;max-height:44dvh;border-radius:22px;padding:8px 8px 10px;gap:6px}
  .panel.sheet .panel-head h2{font-size:17px}
  .panel.sheet .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .panel.sheet .tile{padding:6px 2px 4px;font-size:11px;border-radius:14px}
  .panel.sheet .tile img,.panel.sheet .tile svg{width:54px;height:34px}
  .panel.sheet .tile.big img{width:58px;height:64px}
  .panel.sheet .picker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:start}
  .panel.sheet .picker .sv{grid-row:1 / span 3}
  .panel.sheet .picker .pk-label,.panel.sheet .picker .pk-ink{grid-column:1 / -1}
  .panel.sheet .pk-ink{grid-template-columns:repeat(3,minmax(0,1fr))}
  .panel.sheet .pk-sw{grid-template-columns:repeat(5,minmax(0,1fr))}
  .panel.sheet .pk-sw span{width:26px;height:26px}
  .photo-card{padding:12px;border-radius:22px}
}
@media (max-width:360px){
  .panel.sheet .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .panel.sheet .pk-ink{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-height:640px) and (max-width:600px){
  .panel.sheet{max-height:50dvh}
  .app{grid-template-rows:auto minmax(160px,1fr)}
}
@media (prefers-reduced-motion: reduce){.cap-ring{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="round" id="backBtn" aria-label="Retour" disabled>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="title"></h1>
    <button class="round" id="resetBtn" aria-label="Recommencer à zéro">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>
    </button>
  </header>

  <section class="stage" id="stage">
    <canvas id="gl" role="img" aria-label="Ton stylo en 3D. Glisse pour le faire tourner, touche le bouchon pour le personnaliser."></canvas>
    <div class="cap-ring" id="capRing"></div>
    <div class="hint" id="hint">Touche le bouchon pour le personnaliser !</div>
    <div class="nametag" id="nametag" hidden></div>
    <p class="tip" id="tip">Glisse pour le faire tourner</p>
    <aside class="panel" id="panel" hidden aria-labelledby="panelTitle">
      <div class="panel-head">
        <h2 id="panelTitle">Les yeux</h2>
        <button class="close" id="closePanel" aria-label="Fermer le panneau">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="grid" id="grid"></div>
    </aside>
  </section>

  <div class="bottom" id="viewAtelier">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Parties du stylo"></nav>
    <button class="primary" id="toName">Donner un nom
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>

  <div class="bottom" id="viewNom" hidden>
    <label class="lbl" for="nameInput">Comment s’appelle ton stylo ?</label>
    <div class="namefield">
      <input id="nameInput" type="text" maxlength="14" autocomplete="off" placeholder="Son prénom">
      <button class="dice" id="dice" aria-label="Choisir un nom au hasard">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2B2350" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="#2B2350"/><circle cx="15.5" cy="15.5" r="1.2" fill="#2B2350"/><circle cx="15.5" cy="8.5" r="1.2" fill="#2B2350"/><circle cx="8.5" cy="15.5" r="1.2" fill="#2B2350"/><circle cx="12" cy="12" r="1.2" fill="#2B2350"/></svg>
      </button>
    </div>
    <div class="chips" id="chips"></div>
    <button class="primary" id="toShare" disabled>Terminer mon stylo
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>
    </button>
  </div>

  <div class="bottom" id="viewPartage" hidden>
    <button class="primary" id="saveImg">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
      Envoyer l’image à un ami
    </button>
    <div class="row">
      <button class="secondary" id="again">Un autre stylo</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </div>
</div>

<input type="file" id="photoInput" accept="image/*" hidden>
<div class="photo" id="photoOv" hidden role="dialog" aria-modal="true" aria-labelledby="photoTitle">
  <div class="photo-card">
    <h2 id="photoTitle">Touche ta photo pour prendre une couleur</h2>
    <div class="photo-box" id="photoBox"><canvas id="photoCv" width="10" height="10"></canvas><span class="photo-dot" id="photoDot" hidden></span></div>
    <div class="pk-row"><span class="pk-prev" id="photoPrev"></span><span class="pk-hex" id="photoHex">Touche la photo</span></div>
    <div class="row"><button class="secondary" id="photoCancel" type="button">Annuler</button><button class="primary" id="photoOk" type="button" disabled>Choisir</button></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

  else if(t==='amour'){c.beginPath();c.moveTo(cx-10*k,my-3*k);c.quadraticCurveTo(cx,my+8*k,cx+10*k,my-3*k);c.stroke();c.fillStyle='rgba(255,130,175,.75)';[-1,1].forEach(s=>{c.beginPath();c.ellipse(cx+s*44*k,my-8*k,9*k,5*k,0,0,Math.PI*2);c.fill();});}
  else if(t==='ferme'){c.beginPath();c.moveTo(cx-12*k,my-2*k);c.quadraticCurveTo(cx-6*k,my+7*k,cx,my-2*k);c.quadraticCurveTo(cx+6*k,my+7*k,cx+12*k,my-2*k);c.stroke();}
  else if(t==='colere'){c.fillStyle='#fff';c.lineWidth=3*k;c.beginPath();c.rect(cx-14*k,my-6*k,28*k,13*k);c.fill();c.stroke();c.lineWidth=2*k;[-5,0,5].forEach(d=>seg(c,cx+d*k,my-6*k,cx+d*k,my+7*k));}
  else if(t==='emerveille'){c.beginPath();c.ellipse(cx,my+2*k,6.5*k,8.5*k,0,0,Math.PI*2);c.fillStyle=NAVY;c.fill();c.beginPath();c.ellipse(cx,my+6*k,3.5*k,2.5*k,0,0,Math.PI*2);c.fillStyle='#FF6FA8';c.fill();}
  else if(t==='manga'){c.beginPath();c.moveTo(cx-7*k,my-2*k);c.quadraticCurveTo(cx,my+11*k,cx+7*k,my-2*k);c.closePath();c.fillStyle=NAVY;c.fill();c.lineWidth=2.5*k;c.stroke();c.strokeStyle='#FF6FA8';[-1,1].forEach(s=>{for(let i=0;i<3;i++){const x0=cx+s*(30+i*6)*k;seg(c,x0-3*k,my-4*k,x0+3*k,my-12*k);}});}
  else if(t==='rieurs'){c.save();c.beginPath();c.moveTo(cx-18*k,my-6*k);c.quadraticCurveTo(cx,my+24*k,cx+18*k,my-6*k);c.closePath();c.fillStyle=NAVY;c.fill();c.clip();c.fillStyle='#fff';c.fillRect(cx-20*k,my-7*k,40*k,6*k);c.fillStyle='#FF6FA8';c.beginPath();c.ellipse(cx,my+10*k,8*k,4*k,0,0,Math.PI*2);c.fill();c.restore();c.strokeStyle=NAVY;c.lineWidth=3*k;c.beginPath();c.moveTo(cx-18*k,my-6*k);c.quadraticCurveTo(cx,my+24*k,cx+18*k,my-6*k);c.closePath();c.stroke();}

  else if(t==='clin'){c.beginPath();c.ellipse(cx+4*k,my+6*k,5*k,6.5*k,0,0,Math.PI*2);c.fillStyle='#FF6FA8';c.fill();c.lineWidth=2.5*k;c.stroke();c.lineWidth=4*k;c.beginPath();c.moveTo(cx-11*k,my-3*k);c.quadraticCurveTo(cx,my+6*k,cx+11*k,my-3*k);c.stroke();}
  else if(t==='mdr'){c.beginPath();c.moveTo(cx-20*k,my-8*k);c.quadraticCurveTo(cx,my+30*k,cx+20*k,my-8*k);c.closePath();c.fillStyle=NAVY;c.fill();c.lineWidth=3*k;c.stroke();c.beginPath();c.ellipse(cx,my+11*k,9*k,5*k,0,0,Math.PI*2);c.fillStyle='#FF6FA8';c.fill();}
}
/* animal fur ("pelage"): follows the chosen ears; front of the body is x = w/2 */
function drawFur(c,w,h,ear,s){
  const T=128*s,fx=w/2;
  const belly=(col,rx)=>{c.fillStyle=col;c.beginPath();c.ellipse(fx,h*.5,(rx||170)*s,h*.42,0,0,Math.PI*2);c.fill();};
  const spots=(list,col,tile)=>{const t=(tile||256)*s;for(let y=0;y<h+t;y+=t){for(let x=0;x<w+t;x+=t){list.forEach(([u,v,r])=>{c.beginPath();c.arc(x+u*t,y+v*t,r*s,0,Math.PI*2);c.fillStyle=col;c.fill();});}}};
  const wave=(step,amp,lw,col,period)=>{const P=(period||128)*s;c.strokeStyle=col;c.lineWidth=lw*s;c.lineCap='round';for(let y=step*s/2;y<h+step*s;y+=step*s){c.beginPath();c.moveTo(-P,y);for(let x=-P;x<w+P;x+=P){c.quadraticCurveTo(x+P/4,y-amp*s,x+P/2,y);c.quadraticCurveTo(x+3*P/4,y+amp*s,x+P,y);}c.stroke();}};
  const blob=(x,y,r,col)=>{c.fillStyle=col;[[0,0,1],[.6,.3,.7],[-.5,.4,.65],[.2,-.6,.6],[-.4,-.4,.55]].forEach(([dx,dy,k])=>{c.beginPath();c.arc(x+dx*r,y+dy*r,r*k,0,Math.PI*2);c.fill();});};
  switch(ear){
    case 'chat': wave(70,10,9,'rgba(43,35,80,.3)');break;
    case 'tigre': {c.fillStyle='#2B2350';for(let y=40*s;y<h+120*s;y+=120*s){for(let x=0;x<w;x+=128*s){c.beginPath();c.moveTo(x+6*s,y);c.quadraticCurveTo(x+40*s,y-26*s,x+64*s,y-6*s);c.quadraticCurveTo(x+40*s,y-10*s,x+6*s,y);c.fill();c.beginPath();c.moveTo(x+70*s,y+40*s);c.quadraticCurveTo(x+96*s,y+14*s,x+122*s,y+30*s);c.quadraticCurveTo(x+96*s,y+26*s,x+70*s,y+40*s);c.fill();}}break;}
    case 'lynx': spots([[.15,.2,9],[.55,.12,7],[.85,.45,9],[.35,.6,8],[.7,.85,7],[.1,.8,6]],'rgba(91,58,31,.75)',128);break;
    case 'vache': {const t=512*s;for(let y=0;y<h+t;y+=t){for(let x=0;x<w;x+=t){blob(x+.2*t,y+.2*t,50*s,'#2B2350');blob(x+.7*t,y+.45*t,40*s,'#2B2350');blob(x+.3*t,y+.75*t,34*s,'#2B2350');}}break;}
    case 'girafe': {c.fillStyle='#C46A2B';const q=96*s;let j=0;for(let y=0;y<h+q;y+=q,j++){for(let x=(j%2)*q/2;x<w+q;x+=q){c.beginPath();c.ellipse(x,y,38*s,32*s,(j*.7+x*.01)%1-.5,0,Math.PI*2);c.fill();}}break;}
    case 'panda': c.fillStyle='#2B2350';c.fillRect(0,h*.06,w,h*.18);c.fillRect(0,h*.84,w,h*.16);break;
    case 'chien': spots([[.1,.15,10],[.4,.3,14],[.75,.1,8],[.6,.6,12],[.2,.7,9],[.9,.8,13],[.45,.9,7]],'#2B2350');break;
    case 'renard': belly('#FFF6E8',150);c.fillStyle='#5B3A1F';c.fillRect(0,h*.9,w,h*.1);break;
    case 'loup': belly('#E9E6F2',150);for(let y=60*s;y<h;y+=90*s){c.strokeStyle='rgba(43,35,80,.25)';c.lineWidth=8*s;c.beginPath();c.moveTo(fx+300*s,y);c.lineTo(fx+512*s,y+30*s);c.lineTo(fx+724*s,y);c.stroke();}break;
    case 'ours': belly('#E8C49A');break;
    case 'koala': belly('#FFFFFF',160);wave(60,6,5,'rgba(255,255,255,.55)',64);break;
    case 'lapin': belly('#FFFFFF',150);break;
    case 'souris': belly('#FFE3EE',140);break;
    case 'hamster': belly('#FFF6E8',190);break;
    case 'lion': belly('#FFF1D6',160);break;
    case 'cochon': spots([[.2,.25,14],[.7,.15,10],[.5,.6,16],[.15,.8,9],[.85,.75,12]],'rgba(255,111,168,.45)');break;
    case 'renne': {for(let y=40*s;y<h;y+=70*s){for(let x=0;x<w;x+=64*s){const off=Math.abs(((x+32*s)-fx));if(off<150*s)continue;c.beginPath();c.arc(x+32*s+((y/(70*s))%2)*16*s,y,9*s,0,Math.PI*2);c.fillStyle='rgba(255,255,255,.9)';c.fill();}}break;}
    case 'hibou': {c.strokeStyle='rgba(122,82,54,.6)';c.lineWidth=6*s;const q=48*s;let j=0;for(let y=q;y<h+q;y+=q*.7,j++){for(let x=(j%2)*q/2;x<w+q;x+=q){c.beginPath();c.arc(x,y-q*.35,q*.4,.15*Math.PI,.85*Math.PI);c.stroke();}}break;}
    case 'elephant': {c.strokeStyle='rgba(43,35,80,.2)';c.lineWidth=6*s;c.lineCap='round';let j=0;for(let y=40*s;y<h;y+=56*s,j++){for(let x=(j%2)*64*s;x<w;x+=128*s){c.beginPath();c.arc(x+40*s,y+30*s,34*s,1.2*Math.PI,1.8*Math.PI);c.stroke();}}break;}
    case 'ecureuil': belly('#FFF6E8',140);c.fillStyle='#7A4A1F';[-230,-280,230,280].forEach(o=>c.fillRect(fx+o*s-9*s,0,18*s,h));break;
    case 'chauvesouris': {c.strokeStyle='rgba(43,35,80,.3)';c.lineWidth=6*s;for(let x=0;x<w;x+=64*s){c.beginPath();for(let y=0;y<h+80*s;y+=80*s){c.moveTo(x,y);c.quadraticCurveTo(x+32*s,y+40*s,x+64*s,y);}c.stroke();}break;}
    case 'lama': {const cols=['#E5484D','#FFC531','#3FBF97','#7C5CFF','#FF6FA8'];let i=0;for(let y=30*s;y<h;y+=110*s,i++){c.fillStyle=cols[i%5];c.beginPath();c.moveTo(0,y);for(let x=0;x<=w;x+=32*s){c.lineTo(x,y+((x/(32*s))%2?-14*s:14*s));}c.lineTo(w,y+30*s);for(let x=w;x>=0;x-=32*s){c.lineTo(x,y+30*s+((x/(32*s))%2?-14*s:14*s));}c.closePath();c.fill();}break;}
    case 'mouton': {c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=7*s;c.lineCap='round';let j=0;for(let y=30*s;y<h+40*s;y+=46*s,j++){for(let x=(j%2)*32*s;x<w+64*s;x+=64*s){c.beginPath();c.arc(x,y,16*s,.2,Math.PI*1.7);c.stroke();}}break;}
    case 'antennes': {const q=56*s;let j=0;for(let y=0;y<h+q;y+=q*.6,j++){for(let x=(j%2)*q/2;x<w+q;x+=q){c.beginPath();c.arc(x,y,q*.5,0,Math.PI);c.fillStyle='rgba(124,92,255,.25)';c.fill();c.strokeStyle='rgba(124,92,255,.6)';c.lineWidth=4*s;c.stroke();}}break;}
  }
}
function drawPattern(c,w,h,p,s){
  if(p==='pelage'){drawFur(c,w,h,S.ear,s||1);return;}
  s=s||1;const T=128*s;
  if(p==='pois'){let i=0;for(let y=T/4;y<h+T;y+=T/2,i++){for(let x=(i%2)*T/2+T/4;x<w+T;x+=T){dot(c,x,y,15*s,i%2?'#3FBF97':'#FF6FA8');}}}
  else if(p==='etoiles'){for(let y=0;y<h+T;y+=T){for(let x=0;x<w+T;x+=T){star(c,x+T*.3,y+T*.3,22*s,'#FFC531',NAVY,3*s);star(c,x+T*.78,y+T*.78,12*s,'#7C5CFF');}}}
  else if(p==='rayures'){c.fillStyle='rgba(124,92,255,.5)';const P=64*s;for(let x=-h;x<w+h;x+=P){c.beginPath();c.moveTo(x,0);c.lineTo(x+26*s,0);c.lineTo(x+26*s+h,h);c.lineTo(x+h,h);c.closePath();c.fill();}}
  else if(p==='coeurs'){for(let y=0;y<h+T;y+=T){for(let x=0;x<w+T;x+=T){heart(c,x+T*.28,y+T*.3,34*s,'#FF4F8B');heart(c,x+T*.76,y+T*.78,26*s,'#FF9EC3');}}}
  else if(p==='tricot'){const B=192*s;for(let y=0;y<h+B;y+=B){c.fillStyle='#E5484D';c.fillRect(0,y,w,30*s);c.fillRect(0,y+150*s,w,12*s);c.fillStyle='#2F9E6E';for(let x=0;x<w+32*s;x+=32*s){c.beginPath();c.moveTo(x,y+92*s);c.lineTo(x+16*s,y+62*s);c.lineTo(x+32*s,y+92*s);c.closePath();c.fill();}for(let x=16*s;x<w;x+=64*s){dot(c,x,y+120*s,6*s,'#E5484D');}}}
  else if(p==='arcenciel'){const cols=['#FF6B6B','#FFA94D','#FFE066','#69DB7C','#4DABF7','#9775FA'],bh=36*s;let i=0;for(let y=0;y<h;y+=bh,i++){c.fillStyle=cols[i%6];c.fillRect(0,y,w,bh);}}
  else if(p==='damier'){const q=64*s;c.fillStyle='rgba(255,111,168,.55)';for(let j=0,y=0;y<h;y+=q,j++){for(let i=0,x=0;x<w;x+=q,i++){if((i+j)%2)c.fillRect(x,y,q,q);}}}
  else if(p==='zigzag'){c.lineWidth=10*s;c.lineJoin='round';c.lineCap='round';let i=0;for(let y=32*s;y<h+64*s;y+=64*s,i++){c.strokeStyle=i%2?'#3FBF97':'#7C5CFF';c.beginPath();let k2=0;for(let x=-32*s;x<=w+32*s;x+=32*s,k2++){c.lineTo(x,y+(k2%2?-14*s:14*s));}c.stroke();}}
  else if(p==='nuages'){const pts=[[-14,4,13],[0,-6,16],[15,3,12],[0,8,12]];for(let y=0;y<h+T;y+=T){for(let x=0;x<w+T;x+=T){[[x+T*.3,y+T*.35,1],[x+T*.78,y+T*.82,.7]].forEach(([cx,cy,m])=>{c.lineWidth=5*s;c.strokeStyle='#2B2350';pts.forEach(([dx,dy,r])=>{c.beginPath();c.arc(cx+dx*s*m,cy+dy*s*m,r*s*m,0,Math.PI*2);c.stroke();});pts.forEach(([dx,dy,r])=>dot(c,cx+dx*s*m,cy+dy*s*m,r*s*m,'#FFFFFF'));});}}}
  else if(p==='fleurs'){const fl=(cx,cy,r,pc)=>{for(let i=0;i<5;i++){const a=i*Math.PI*2/5-Math.PI/2;dot(c,cx+Math.cos(a)*r*1.1,cy+Math.sin(a)*r*1.1,r*.85,pc);}dot(c,cx,cy,r*.6,'#FFC531');};for(let y=0;y<h+T;y+=T){for(let x=0;x<w+T;x+=T){fl(x+T*.28,y+T*.3,13*s,'#FF6FA8');fl(x+T*.76,y+T*.78,9*s,'#9775FA');}}}
  else if(p==='confettis'){const bits=[[.12,.18,.4,'#FF6B6B'],[.45,.1,-.6,'#4DABF7'],[.8,.25,.9,'#FFC531'],[.25,.55,1.2,'#69DB7C'],[.62,.48,-.3,'#9775FA'],[.9,.7,.5,'#FF6FA8'],[.1,.85,-1,'#FFA94D'],[.5,.85,.2,'#3FBF97']];for(let y=0;y<h+T;y+=T){for(let x=0;x<w+T;x+=T){bits.forEach(([u,vv,a,col])=>{c.save();c.translate(x+u*T,y+vv*T);c.rotate(a);c.fillStyle=col;c.fillRect(-9*s,-4*s,18*s,8*s);c.restore();});}}}
  else if(p==='cerises'){for(let y=0;y<h+T;y+=T){for(let x=0;x<w+T;x+=T){const cx=x+T*.5,cy=y+T*.6;c.strokeStyle='#2F9E6E';c.lineWidth=4*s;c.lineCap='round';c.beginPath();c.moveTo(cx-12*s,cy);c.quadraticCurveTo(cx-6*s,cy-26*s,cx+2*s,cy-34*s);c.moveTo(cx+12*s,cy);c.quadraticCurveTo(cx+8*s,cy-22*s,cx+2*s,cy-34*s);c.stroke();c.beginPath();c.ellipse(cx+12*s,cy-34*s,10*s,5*s,-.4,0,Math.PI*2);c.fillStyle='#3FBF97';c.fill();dot(c,cx-12*s,cy+6*s,11*s,'#E5484D');dot(c,cx+12*s,cy+6*s,11*s,'#E5484D');dot(c,cx-15*s,cy+2*s,3*s,'rgba(255,255,255,.8)');dot(c,cx+9*s,cy+2*s,3*s,'rgba(255,255,255,.8)');}}}
  else if(p==='leopard'){const sp=[[.2,.2,14,10,.3],[.65,.15,11,8,-.4],[.45,.5,15,11,.8],[.85,.55,10,8,0],[.15,.75,12,9,-.6],[.62,.88,13,9,.2]];for(let y=0;y<h+T;y+=T){for(let x=0;x<w+T;x+=T){sp.forEach(([u,vv,rx,ry,a])=>{const cx=x+u*T,cy=y+vv*T;c.beginPath();c.ellipse(cx,cy,rx*s,ry*s,a,0,Math.PI*2);c.fillStyle='#E0A458';c.fill();c.strokeStyle='#5B3A1F';c.lineWidth=5*s;c.lineCap='round';[[.2,1.6],[2.4,3.9],[4.5,5.7]].forEach(([a0,a1])=>{c.beginPath();c.ellipse(cx,cy,(rx+3)*s,(ry+3)*s,a,a0,a1);c.stroke();});});}}}
  else if(p==='ecossais'){for(let x=0;x<w+T;x+=T){c.fillStyle='rgba(229,72,77,.4)';c.fillRect(x,0,44*s,h);c.fillStyle='rgba(43,35,80,.35)';c.fillRect(x+84*s,0,6*s,h);}for(let y=0;y<h+T;y+=T){c.fillStyle='rgba(229,72,77,.4)';c.fillRect(0,y,w,44*s);c.fillStyle='rgba(43,35,80,.35)';c.fillRect(0,y+84*s,w,6*s);}}
  else if(p==='vagues'){c.strokeStyle='rgba(77,171,247,.85)';c.lineWidth=8*s;c.lineCap='round';const P=64*s;for(let y=24*s;y<h+P;y+=44*s){c.beginPath();c.moveTo(-P,y);for(let x=-P;x<w+P;x+=P){c.quadraticCurveTo(x+P/4,y-12*s,x+P/2,y);c.quadraticCurveTo(x+3*P/4,y+12*s,x+P,y);}c.stroke();}}
}

const headCv=document.createElement('canvas');headCv.width=1024;headCv.height=640;
const bodyCv=document.createElement('canvas');bodyCv.width=1024;bodyCv.height=1408;
function paintHead(){const c=headCv.getContext('2d');c.fillStyle=S.color;c.fillRect(0,0,1024,640);const keep=NAVY;NAVY=lum(S.color)<.1?'#FFFFFF':'#2B2350';drawEyes(c,512,300,2.3,S.eye);drawMouth(c,512,360,2.3,S.mouth);NAVY=keep;}
/* seasonal costume prints, drawn over fur + pattern */
function drawCostume(c,w,h,id,s){
  const t=256*s,each=fn=>{for(let y=0;y<h+t;y+=t)for(let x=0;x<w+t;x+=t)fn(x,y);};
  const leaf=(x,y,r,a,col)=>{c.save();c.translate(x,y);c.rotate(a);c.beginPath();c.moveTo(0,-r);c.quadraticCurveTo(r*.85,0,0,r);c.quadraticCurveTo(-r*.85,0,0,-r);c.fillStyle=col;c.fill();c.strokeStyle='rgba(0,0,0,.25)';c.lineWidth=2*s;c.beginPath();c.moveTo(0,-r);c.lineTo(0,r*1.2);c.stroke();c.restore();};
  const flake=(x,y,r,col)=>{c.strokeStyle=col;c.lineWidth=3.5*s;c.lineCap='round';for(let i=0;i<6;i++){const a=i*Math.PI/3;c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);c.stroke();}};
  const bat=(x,y)=>{const k=s;c.fillStyle='#2B2350';c.beginPath();c.moveTo(x-28*k,y-4*k);c.quadraticCurveTo(x-14*k,y-14*k,x-6*k,y-2*k);c.quadraticCurveTo(x,y-10*k,x+6*k,y-2*k);c.quadraticCurveTo(x+14*k,y-14*k,x+28*k,y-4*k);c.quadraticCurveTo(x+16*k,y+4*k,x+10*k,y+10*k);c.quadraticCurveTo(x,y+2*k,x-10*k,y+10*k);c.quadraticCurveTo(x-16*k,y+4*k,x-28*k,y-4*k);c.fill();};

  return new Promise(res=>c.toBlob(res,'image/png'));
}
$('saveImg').addEventListener('click',async()=>{
  const st=$('status');
  if(!renderer){st.textContent='La 3D n’est pas disponible sur cet appareil.';return;}
  st.textContent='Préparation de l’image…';
  const blob=await buildCard();
  if(!downloads){
    const fname=(penName||'mon-stylo').replace(/[^\p{L}\p{N} _-]/gu,'')+'.png';
    try{
      const file=new File([blob],fname,{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:penName||'Mon stylo'});st.textContent='Image partagée.';return;}
    }catch(err){if(err&&err.name==='AbortError'){st.textContent='Partage annulé.';return;}}
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
    st.textContent='Image enregistrée dans tes téléchargements.';return;
  }
  try{await downloads.save({filename:(penName||'mon-stylo').replace(/[^\p{L}\p{N} _-]/gu,'')+'.png',data:blob});st.textContent='Image prête, tu peux l’envoyer à tes amis.';}
  catch(err){st.textContent=err&&err.code==='declined'?'Enregistrement annulé.':'L’image n’a pas pu être enregistrée.';}
});

/* init */
if(!renderer){$('tip').textContent='La 3D n’est pas disponible sur cet appareil.';hint.hidden=true;ring.hidden=true;}
$('title').innerHTML='<img src="'+LOGO_URI+'" alt="" width="32" height="32" style="border-radius:9px"><span>Lisoé</span>';
buildEars();renderTabs();resize();requestAnimationFrame(frame);
})();
</script>
